name: Deploy Hand-Eye Visualization to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '4-hand-eye-calibration/visualization/**'
      - '4-hand-eye-calibration/results/corner_detection/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Copy result images into deploy directory
        run: |
          mkdir -p 4-hand-eye-calibration/visualization/results/corner_detection
          cp 4-hand-eye-calibration/results/corner_detection/*.png 4-hand-eye-calibration/visualization/results/corner_detection/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 4-hand-eye-calibration/visualization

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
